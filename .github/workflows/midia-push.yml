name: midia-push
on:
  push:
    branches: [midia-tmp]
    paths: [midia_lista.txt]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p midia_tmp
          while read -r u d; do [ -z "$u" ] && continue; curl -sSL -o "midia_tmp/$d" "$u"; ls -la "midia_tmp/$d"; done < midia_lista.txt
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -f midia_tmp && git commit -m "Midia baixada" && git push
